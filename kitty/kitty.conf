include ~/.config/kitty/oasis-starlight.conf
# include ~/.config/kitty/github-cb.conf

#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#
#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#
#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#

allow_remote_control                                                                    yes 
scrollback_lines                                                                        10000 
enable_audio_bell                                                                       no 
shell_integration                                                                       no-cursor 
cursor_shape                                                                            block 
cursor_blink_interval                                                                   0 
copy_on_select                                                                          yes
enabled_layouts                                                                         Splits
# draw_minimal_borders                                                                    yes

#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------# 
#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------# 
#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------# 

font_size                                                                               16
# text_composition_strategy                                                               1.1 30

# font_family                                                                             family='UbuntuMono Nerd Font'
font_family                                                                             family='Iosevka Nerd Font Mono'
# font_family                                                                             family='Iosevka Nerd Font'
# font_family                                                                             family='ZedMono Nerd Font'
bold_font                                                                               auto
italic_font                                                                             auto
bold_italic_font                                                                        auto

#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------# 
#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------# 
#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------# 
# PADDING: AREA BETWEEN TEXT AND BORDER
# MARGIN: AREA OUTSIDE BORDER
window_padding_width                                                                    4 4 4 4 
window_margin_width                                                                     4 4 4 4 
window_border_width                                                                     2 
repaint_delay                                                                           8 
input_delay                                                                             1 
sync_to_monitor                                                                         no 

