# include ~/.config/kitty/github.conf
include ~/.config/kitty/github-cb.conf

#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#
#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#
#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#

allow_remote_control                                                                    yes 
scrollback_lines                                                                        10000 
enable_audio_bell                                                                       no 
shell_integration                                                                       no-cursor 
cursor_shape                                                                            block 
cursor_blink_interval                                                                   0 
copy_on_select                                                                          yes
draw_minimal_borders                                                                    yes
enabled_layouts                                                                         Splits

#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------# 
#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------# 
#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------# 

font_size                                                                               18
text_composition_strategy                                                               1.1 30

font_family                                                                             family='UbuntuMono Nerd Font'
bold_font                                                                               family='UbuntuMono Nerd Font' style=Bold
italic_font                                                                             family='UbuntuMono Nerd Font' style=Regular
bold_italic_font                                                                        family='UbuntuMono Nerd Font' style=Regular
# font_family                                                                   family='CaskaydiaMono Nerd Font Mono' style=Regular
# italic_font                                                                   family='CaskaydiaMono Nerd Font Mono' style=Regular
# bold_italic_font                                                              family='CaskaydiaMono Nerd Font Mono' style=Regular
# bold_font                                                                     family='CaskaydiaMono Nerd Font Mono' style=Bold 
# font_family                                                                   family="UbuntuMono Nerd Font Mono"
# bold_font                                                                     auto
# italic_font                                                                   family='UbuntuMono Nerd Font Mono' style=Regular
# bold_italic_font                                                              family='UbuntuMono Nerd Font Mono' style=Regular

#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------# 
#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------# 
#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------# 
# PADDING: AREA BETWEEN TEXT AND BORDER
# MARGIN: AREA OUTSIDE BORDER
window_padding_width                                                                    0 0 0 0 
window_margin_width                                                                     0 0 0 0 
window_border_width                                                                     0 
repaint_delay                                                                           8 
input_delay                                                                             1 
sync_to_monitor                                                                         no 

