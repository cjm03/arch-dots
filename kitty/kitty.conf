# include ~/.config/kitty/oldworld.conf
include ~/.config/kitty/github-cb.conf

#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#
#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#
#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#

allow_remote_control                                                                                                          yes 
scrollback_lines                                                                                                            10000 
enable_audio_bell                                                                                                              no 
shell_integration                                                                                                       no-cursor 
cursor_shape                                                                                                                block 
cursor_blink_interval                                                                                                           0 

#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------# 
#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------# 
#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------# 

font_family                                        family='CaskaydiaMono Nerd Font Mono' postscript_name=CaskaydiaMonoNFM-Regular  
italic_font                                        family='CaskaydiaMono Nerd Font Mono' postscript_name=CaskaydiaMonoNFM-Regular 
bold_italic_font                                   family='CaskaydiaMono Nerd Font Mono' postscript_name=CaskaydiaMonoNFM-Regular 
bold_font                                                                        family='CaskaydiaMono Nerd Font Mono' style=Bold 
font_size                                                                                                                      20
# text_composition_strategy                                                                                                  1.0 25

#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------# 
#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------# 
#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------# 

window_padding_width                                                                                                      0 0 0 0 
window_margin_width                                                                                                       0 0 0 0 
window_border_width                                                                                                             0 
repaint_delay                                                                                                                   8 
input_delay                                                                                                                     1 
sync_to_monitor                                                                                                                no 

#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------#-------# 
