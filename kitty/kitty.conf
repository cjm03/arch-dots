include ~/.config/kitty/Ayu.conf

allow_remote_control    yes
scrollback_lines        10000

font_family             family='CaskaydiaMono Nerd Font Mono' postscript_name=CaskaydiaMonoNFM-Regular
# font_size               16.5
font_size               18
bold_font               family='CaskaydiaMono Nerd Font Mono' style=Bold
italic_font             no
bold_italic_font        no

text_composition_strategy 1.0 0

shell_integration       no-cursor

window_padding_width    0 0 0 0
window_margin_width     0 0 0 0
window_border_width     0

cursor_shape            block
cursor_blink_interval   0

repaint_delay           8
input_delay             1
sync_to_monitor         no
enable_audio_bell       no

# clear_all_shortcuts yes
