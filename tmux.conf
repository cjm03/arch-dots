# set -g default-terminal "screen-256color" # "${TERM}"
# set -ag terminal-overrides ",*:RGB"
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g prefix C-SPACE
set -g base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g mouse on
set-option -g focus-events on
set-option -g allow-passthrough on
set -g visual-activity off

# Status
set-option -g status-position top
set -g mode-style "fg=#c9d1d9,bg=#0a0c10"
set -g message-style "fg=#0a0c10,bg=#c9d1d9"
set -g message-command-style "fg=#0a0c10,bg=#c9d1d9"
set -g pane-border-style "fg=#c9d1d9"
set -g pane-active-border-style "fg=#0366d6" # "fg=#ec8e2c"
set -g pane-border-lines "heavy"
set -g pane-border-indicators "arrows"
set -g popup-border-style "fg=#0366d6"
set -g popup-border-lines "heavy"
set -g status "on"
set -g status-justify "absolute-centre"
set -g status-style "fg=#0366d6,bg=#000000"  ### IMMORTAL
# set -g status-style "fg=#0366d6,bg=#0a0c10"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left "#[fg=#c9d1d9,bg=#000000,bold] #I #[fg=#58a6ff,bg=#000000,nobold,nounderscore,noitalics]" ### IMMORTAL
set -g status-right "#[fg=#c9d1d9,bg=#000000,nobold,nounderscore,noitalics]#[fg=#c9d1d9,bg=#000000] #{prefix_highlight} #[fg=#babbbd,bg=#000000,nobold,nounderscore,noitalics]#[fg=#c9d1d9,bg=#000000,bold] %Y-%m-%d %I:%M %p #[fg=#0366d6,bg=#000000,nobold,nounderscore,noitalics]#[fg=#c9d1d9,bg=#0366d6,bold] #H " ### IMMORTAL
# set -g status-left "#[fg=#c9d1d9,bg=#0a0c10,bold] #I #[fg=#58a6ff,bg=#0a0c10,nobold,nounderscore,noitalics]"
# set -g status-right "#[fg=#c9d1d9,bg=#0a0c10,nobold,nounderscore,noitalics]#[fg=#c9d1d9,bg=#0a0c10] #{prefix_highlight} #[fg=#babbbd,bg=#0a0c10,nobold,nounderscore,noitalics]#[fg=#c9d1d9,bg=#0a0c10,bold] %Y-%m-%d %I:%M %p #[fg=#0366d6,bg=#0a0c10,nobold,nounderscore,noitalics]#[fg=#c9d1d9,bg=#0366d6,bold] #H "
setw -g window-status-activity-style "underscore,fg=#6e7681,bg=#c9d1d9"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#0d1117,bg=#ec8e2c"
setw -g window-status-format "#[fg=#000000,bg=#ec8e2c,nobold,nounderscore,noitalics]#[fg=#ec8e2c,bg=#000000,bold,nounderscore,noitalics] #F#W #[fg=#c9d1d9,bg=#c9d1d9,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#c9d1d9,bg=#ec8e2c,bold,nounderscore,noitalics]#[fg=#000000,bg=#ec8e2c,bold] #F#W #[fg=#ec8e2c,bg=#c9d1d9,nobold,nounderscore,noitalics]"
# setw -g window-status-format "#[fg=#0a0c10,bg=#0366d6,nobold,nounderscore,noitalics]#[fg=#0366d6,bg=#0a0c10,bold,nounderscore,noitalics] #F#W #[fg=#c9d1d9,bg=#c9d1d9,nobold,nounderscore,noitalics]"
# setw -g window-status-current-format "#[fg=#c9d1d9,bg=#ec8e2c,bold,nounderscore,noitalics]#[fg=#0a0c10,bg=#0366d6,bold] #F#W #[fg=#ec8e2c,bg=#c9d1d9,nobold,nounderscore,noitalics]"

bind C-p display-popup -E "python3"
bind C-t display-popup
bind r source-file "/home/crab/.config/tmux/tmux.conf"
bind b set -g status
bind G neww -n "git" -S lazygit
bind E show-environment -g
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R


set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tpm'

run '~/.config/tmux/plugins/tpm/tpm'
