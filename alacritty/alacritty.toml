[general]
import = [
    "~/.config/alacritty/ayudark.toml",
    # "~/.config/alacritty/github.toml",
    # "~/.config/alacritty/lackluster.toml",
]

[env]
TERM = "xterm-256color"

[colors]
transparent_background_colors = false
draw_bold_text_with_bright_colors = true

[window]
padding.x = 4
padding.y = 4
opacity = 1.0
blur = false
dynamic_padding = false

[mouse]
hide_when_typing = true

[font]
# normal = { family = "Iosevka Nerd Font Mono", style = "Regular" }
# bold = { family = "Iosevka Nerd Font Mono", style = "Regular" }
# italic = { family = "Iosevka Nerd Font Mono", style = "Regular" }
# bold_italic = { family = "Iosevka Nerd Font Mono", style = "Regular" }
# normal = { family = "Iosevka Nerd Font Mono", style = "Medium" }
# bold = { family = "Iosevka Nerd Font Mono", style = "Medium" }
# italic = { family = "Iosevka Nerd Font Mono", style = "Medium" }
# bold_italic = { family = "Iosevka Nerd Font Mono", style = "Medium" }
normal = { family = "Cascadia Code NF", style = "Regular" }
bold = { family = "Cascadia Code NF", style = "Regular" }
italic = { family = "Cascadia Code NF", style = "Regular" }
bold_italic = { family = "Cascadia Code NF", style = "Regular" }
size = 18
# offset = { x = -1, y = -1 }

[cursor]
style = { shape = "Block" }

[selection]
save_to_clipboard = true

[debug]
render_timer = false
