[general]
import = [
    "~/.config/alacritty/github-cb.toml",
]
[colors]
transparent_background_colors = false
draw_bold_text_with_bright_colors = true

[window]
padding.x = 4
padding.y = 4
opacity = 1.0
blur = false
dynamic_padding = false

[mouse]
hide_when_typing = true

[font]
# normal = { family = "CaskaydiaMono Nerd Font Mono", style = "Regular" }
# bold = { family = "CaskaydiaMono Nerd Font Mono", style = "Bold" }
# italic = { family = "CaskaydiaMono Nerd Font Mono", style = "Regular" }
# bold_italic = { family = "CaskaydiaMono Nerd Font Mono", style = "Regular" }
normal = { family = "UbuntuMono Nerd Font", style = "Regular" }
bold = { family = "UbuntuMono Nerd Font", style = "Bold" }
italic = { family = "UbuntuMono Nerd Font", style = "Regular" }
bold_italic = { family = "UbuntuMono Nerd Font", style = "Regular" }
size = 18

[cursor]
style = { shape = "Block" }

[selection]
save_to_clipboard = true

[debug]
render_timer = false
